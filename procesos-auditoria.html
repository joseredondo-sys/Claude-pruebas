<style>
  /* ===================================================================
     WIDGET PROCESOS · AUDITORÍA — Pipeline orbital
     100% responsive, scopeado para Elementor (no toca body/html).
     ================================================================= */

  @property --nxcsb02-roi{
    syntax:'<integer>';
    inherits:false;
    initial-value:0;
  }
  @property --nxcsb02-stage{
    syntax:'<integer>';
    inherits:false;
    initial-value:0;
  }

  .nxcsb02-viz,
  .nxcsb02-viz *,
  .nxcsb02-viz *::before,
  .nxcsb02-viz *::after{
    box-sizing:border-box;
  }

  .nxcsb02-viz{
    --nx-bg-a:#FAFAFC;
    --nx-bg-b:#F3F1FA;
    --nx-primary:#6C5CE7;
    --nx-primary-2:#7C6FF0;
    --nx-primary-3:#9B8BFF;
    --nx-primary-dark:#4A3DC9;
    --nx-ink:#1A1433;
    --nx-accent:#E85BE5;

    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:clamp(14px,4cqi,22px);
    overflow:hidden;
    background:radial-gradient(ellipse at center,var(--nx-bg-a),var(--nx-bg-b));
    border:1px solid rgba(108,92,231,.14);
    box-shadow:
      0 clamp(10px,3cqi,24px) clamp(30px,9cqi,60px) -12px rgba(108,92,231,.35),
      0 2px 0 rgba(255,255,255,.6) inset;
    container-type:inline-size;
    container-name:nxcsb02viz;
    isolation:isolate;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
    animation:nxcsb02enter 1s cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes nxcsb02enter{
    from{opacity:0;transform:translateY(10px) scale(.97)}
    to{opacity:1;transform:none}
  }

  /* Background decorations */
  .nxcsb02-viz .nxcsb02-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(108,92,231,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(108,92,231,.07) 1px,transparent 1px);
    background-size:11% 11%;
    opacity:.55;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 45%,transparent 95%);
            mask-image:radial-gradient(ellipse at center,#000 45%,transparent 95%);
  }
  .nxcsb02-viz .nxcsb02-glow{
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%,rgba(108,92,231,.22),transparent 60%);
    animation:nxcsb02breath 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes nxcsb02breath{
    0%,100%{opacity:.5;transform:scale(.97)}
    50%{opacity:1;transform:scale(1.03)}
  }

  /* Corner markers */
  .nxcsb02-viz .nxcsb02-corners{position:absolute;inset:clamp(10px,3cqi,18px);pointer-events:none;z-index:4}
  .nxcsb02-viz .nxcsb02-corners::before,
  .nxcsb02-viz .nxcsb02-corners::after,
  .nxcsb02-viz .nxcsb02-corners > i{
    content:'';position:absolute;
    width:clamp(10px,3cqi,18px);height:clamp(10px,3cqi,18px);
    border:1.5px solid rgba(108,92,231,.35);
    border-radius:3px;
  }
  .nxcsb02-viz .nxcsb02-corners::before{top:0;left:0;border-right:0;border-bottom:0}
  .nxcsb02-viz .nxcsb02-corners::after{top:0;right:0;border-left:0;border-bottom:0}
  .nxcsb02-viz .nxcsb02-corners .bl{bottom:0;left:0;border-right:0;border-top:0;display:block}
  .nxcsb02-viz .nxcsb02-corners .br{bottom:0;right:0;border-left:0;border-top:0;display:block}

  /* HUD */
  .nxcsb02-viz .nxcsb02-hud,
  .nxcsb02-viz .nxcsb02-hud-r{
    position:absolute;z-index:5;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(8px,2.2cqi,10.5px);
    letter-spacing:.14em;
    text-transform:uppercase;
    line-height:1;
    white-space:nowrap;
    margin:0;
  }
  .nxcsb02-viz .nxcsb02-hud{
    left:clamp(14px,4.5cqi,24px);
    top:clamp(14px,4.5cqi,24px);
    color:rgba(108,92,231,.8);
    display:flex;gap:clamp(6px,1.8cqi,10px);align-items:center;
  }
  .nxcsb02-viz .nxcsb02-hud span{
    width:clamp(5px,1.4cqi,7px);aspect-ratio:1/1;
    border-radius:50%;
    background:var(--nx-primary);
    box-shadow:0 0 clamp(4px,1.6cqi,9px) var(--nx-primary);
    animation:nxcsb02pulse 1.6s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes nxcsb02pulse{
    0%,100%{opacity:.4;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.1)}
  }
  .nxcsb02-viz .nxcsb02-hud-r{
    right:clamp(14px,4.5cqi,24px);
    top:clamp(14px,4.5cqi,24px);
    color:var(--nx-primary);
    display:flex;align-items:center;gap:clamp(4px,1.2cqi,6px);
    font-weight:700;
  }
  .nxcsb02-viz .nxcsb02-hud-r::before{
    content:'▲';font-size:.8em;color:var(--nx-primary);
    animation:nxcsb02trendUp 1.8s ease-in-out infinite;
  }
  @keyframes nxcsb02trendUp{
    0%,100%{transform:translateY(0);opacity:.7}
    50%{transform:translateY(-25%);opacity:1}
  }

  /* ===== Stage (central pipeline) ===== */
  .nxcsb02-viz .nxcsb02-stage{
    position:absolute;
    inset:clamp(40px,14cqi,70px) clamp(10px,3cqi,18px) clamp(50px,16cqi,80px);
    display:grid;place-items:center;
  }
  .nxcsb02-viz .nxcsb02-ring-wrap{
    position:relative;
    width:min(100%,100cqh - 30%);
    aspect-ratio:1/1;
    max-width:min(82%,82cqi);
  }

  /* SVG ring (track + animated fill) */
  .nxcsb02-viz .nxcsb02-ring{
    position:absolute;inset:0;
    width:100%;height:100%;
    overflow:visible;
    filter:drop-shadow(0 1.5cqi 3cqi rgba(108,92,231,.25));
  }
  .nxcsb02-viz .nxcsb02-ring-track{
    fill:none;
    stroke:rgba(108,92,231,.15);
    stroke-width:1.6;
  }
  .nxcsb02-viz .nxcsb02-ring-fill{
    fill:none;
    stroke:url(#nxcsb02ringGrad);
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-dasharray:100 100;
    stroke-dashoffset:100;
    animation:nxcsb02fillRing 7s cubic-bezier(.65,0,.35,1) infinite;
  }
  .nxcsb02-viz .nxcsb02-ring-spark{
    fill:var(--nx-accent);
    filter:drop-shadow(0 0 4px var(--nx-accent));
    offset-path:circle(40% at 50% 50%);
    offset-rotate:0deg;
    animation:nxcsb02orbit 7s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes nxcsb02fillRing{
    0%{stroke-dashoffset:100}
    55%{stroke-dashoffset:0}
    78%{stroke-dashoffset:0}
    88%{stroke-dashoffset:0;opacity:1}
    92%{stroke-dashoffset:0;opacity:.3}
    100%{stroke-dashoffset:100;opacity:1}
  }
  @keyframes nxcsb02orbit{
    0%{offset-distance:0%;opacity:0}
    5%{opacity:1}
    55%{offset-distance:100%;opacity:1}
    60%,100%{offset-distance:100%;opacity:0}
  }

  /* ===== Gauge center ===== */
  .nxcsb02-viz .nxcsb02-gauge{
    position:absolute;
    inset:22%;
    border-radius:50%;
    background:
      radial-gradient(circle at 30% 30%,#fff,#F6F3FF 70%,#EDE8FF);
    border:1px solid rgba(108,92,231,.15);
    box-shadow:
      inset 0 0 clamp(10px,3cqi,20px) rgba(108,92,231,.08),
      0 clamp(6px,2.5cqi,14px) clamp(16px,6cqi,32px) rgba(108,92,231,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(2px,.6cqi,4px);
    overflow:hidden;
  }
  .nxcsb02-viz .nxcsb02-gauge::before{
    content:'';position:absolute;inset:0;
    background:conic-gradient(from -90deg,rgba(108,92,231,.15),transparent 40%);
    opacity:0;
    animation:nxcsb02gaugeSheen 7s linear infinite;
  }
  @keyframes nxcsb02gaugeSheen{
    0%,80%{opacity:0;transform:rotate(0)}
    85%{opacity:.8}
    100%{opacity:0;transform:rotate(360deg)}
  }

  .nxcsb02-viz .nxcsb02-gauge-lbl-top{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(7.5px,1.9cqi,9.5px);
    letter-spacing:.2em;
    color:rgba(108,92,231,.65);
    text-transform:uppercase;
  }
  .nxcsb02-viz .nxcsb02-gauge-val{
    font-size:clamp(22px,10cqi,54px);
    font-weight:800;
    letter-spacing:-.03em;
    color:var(--nx-primary-dark);
    line-height:1;
    font-variant-numeric:tabular-nums;
    --nxcsb02-roi:0;
    counter-reset:nxroi var(--nxcsb02-roi);
    animation:nxcsb02count 7s cubic-bezier(.65,0,.35,1) infinite;
    background:linear-gradient(135deg,var(--nx-primary),var(--nx-primary-dark));
    -webkit-background-clip:text;
            background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .nxcsb02-viz .nxcsb02-gauge-val::after{content:'+'counter(nxroi) '%'}
  @keyframes nxcsb02count{
    0%{--nxcsb02-roi:0}
    55%,88%{--nxcsb02-roi:23}
    92%{--nxcsb02-roi:23}
    100%{--nxcsb02-roi:0}
  }
  .nxcsb02-viz .nxcsb02-gauge-lbl{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(7.5px,1.9cqi,9.5px);
    letter-spacing:.18em;
    color:rgba(26,20,51,.55);
    text-transform:uppercase;
  }
  .nxcsb02-viz .nxcsb02-gauge-progress{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(8px,2cqi,10px);
    letter-spacing:.14em;
    color:var(--nx-primary);
    font-weight:700;
    margin-top:clamp(2px,.8cqi,6px);
    --nxcsb02-stage:0;
    counter-reset:nxstage var(--nxcsb02-stage);
    animation:nxcsb02stageCount 7s cubic-bezier(.65,0,.35,1) infinite;
  }
  .nxcsb02-viz .nxcsb02-gauge-progress::after{content:counter(nxstage) ' / 5'}
  @keyframes nxcsb02stageCount{
    0%,7%{--nxcsb02-stage:0}
    10%,22%{--nxcsb02-stage:1}
    25%,37%{--nxcsb02-stage:2}
    40%,52%{--nxcsb02-stage:3}
    55%,67%{--nxcsb02-stage:4}
    70%,92%{--nxcsb02-stage:5}
    100%{--nxcsb02-stage:0}
  }

  /* ===== Orbital nodes ===== */
  .nxcsb02-viz .nxcsb02-node{
    --size:clamp(22px,8cqi,40px);
    position:absolute;
    width:var(--size);height:var(--size);
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    z-index:3;
  }
  .nxcsb02-viz .nxcsb02-node-dot{
    position:absolute;inset:0;
    border-radius:50%;
    background:#fff;
    border:1.5px solid rgba(108,92,231,.28);
    box-shadow:
      0 clamp(3px,1.2cqi,8px) clamp(10px,3.5cqi,18px) rgba(108,92,231,.15),
      0 1px 0 rgba(255,255,255,.8) inset;
    display:grid;place-items:center;
    transition:none;
    overflow:hidden;
  }
  .nxcsb02-viz .nxcsb02-node-num{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(9px,2.6cqi,13px);
    font-weight:700;
    color:var(--nx-primary);
    transition:opacity .25s ease;
  }
  .nxcsb02-viz .nxcsb02-node-check{
    position:absolute;inset:0;
    display:grid;place-items:center;
    opacity:0;
    color:#fff;
    font-size:clamp(11px,3.2cqi,17px);
    font-weight:900;
    line-height:1;
  }
  .nxcsb02-viz .nxcsb02-node-label{
    position:absolute;
    top:calc(100% + clamp(3px,1cqi,6px));
    left:50%;
    transform:translateX(-50%);
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(7px,1.8cqi,9.5px);
    letter-spacing:.14em;
    color:rgba(108,92,231,.65);
    text-transform:uppercase;
    white-space:nowrap;
    transition:color .3s ease, font-weight .3s ease;
  }

  /* Node positions — angle from top, radius 45% of ring-wrap */
  .nxcsb02-viz .nxcsb02-n1{top:5%;left:50%}
  .nxcsb02-viz .nxcsb02-n2{top:33%;left:93%}
  .nxcsb02-viz .nxcsb02-n3{top:85%;left:76%}
  .nxcsb02-viz .nxcsb02-n4{top:85%;left:24%}
  .nxcsb02-viz .nxcsb02-n5{top:33%;left:7%}

  /* Labels that'd clip at edges — shift inline */
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-label,
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-label{
    top:50%;transform:translateY(-50%);
  }
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-label{
    left:auto;right:calc(100% + clamp(3px,1cqi,6px));
  }
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-label{
    left:calc(100% + clamp(3px,1cqi,6px));
    transform:translateY(-50%);
  }
  .nxcsb02-viz .nxcsb02-n3 .nxcsb02-node-label,
  .nxcsb02-viz .nxcsb02-n4 .nxcsb02-node-label{
    top:auto;
    bottom:calc(100% + clamp(3px,1cqi,6px));
  }

  /* Activation animation per node */
  .nxcsb02-viz .nxcsb02-node-dot{
    animation:nxcsb02nodeActivate 7s cubic-bezier(.5,0,.3,1.3) infinite;
  }
  .nxcsb02-viz .nxcsb02-node-num{
    animation:nxcsb02numFade 7s cubic-bezier(.5,0,.3,1.3) infinite;
  }
  .nxcsb02-viz .nxcsb02-node-check{
    animation:nxcsb02checkIn 7s cubic-bezier(.5,0,.3,1.3) infinite;
  }
  .nxcsb02-viz .nxcsb02-node-label{
    animation:nxcsb02labelGlow 7s ease-in-out infinite;
  }

  .nxcsb02-viz .nxcsb02-n1 .nxcsb02-node-dot,
  .nxcsb02-viz .nxcsb02-n1 .nxcsb02-node-num,
  .nxcsb02-viz .nxcsb02-n1 .nxcsb02-node-check,
  .nxcsb02-viz .nxcsb02-n1 .nxcsb02-node-label{animation-delay:.7s}
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-dot,
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-num,
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-check,
  .nxcsb02-viz .nxcsb02-n2 .nxcsb02-node-label{animation-delay:1.75s}
  .nxcsb02-viz .nxcsb02-n3 .nxcsb02-node-dot,
  .nxcsb02-viz .nxcsb02-n3 .nxcsb02-node-num,
  .nxcsb02-viz .nxcsb02-n3 .nxcsb02-node-check,
  .nxcsb02-viz .nxcsb02-n3 .nxcsb02-node-label{animation-delay:2.8s}
  .nxcsb02-viz .nxcsb02-n4 .nxcsb02-node-dot,
  .nxcsb02-viz .nxcsb02-n4 .nxcsb02-node-num,
  .nxcsb02-viz .nxcsb02-n4 .nxcsb02-node-check,
  .nxcsb02-viz .nxcsb02-n4 .nxcsb02-node-label{animation-delay:3.85s}
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-dot,
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-num,
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-check,
  .nxcsb02-viz .nxcsb02-n5 .nxcsb02-node-label{animation-delay:4.9s}

  @keyframes nxcsb02nodeActivate{
    /* 7s loop, activation lasts 0.5s, stays active until reset near end */
    0%{background:#fff;border-color:rgba(108,92,231,.28);box-shadow:0 clamp(3px,1.2cqi,8px) clamp(10px,3.5cqi,18px) rgba(108,92,231,.15),0 1px 0 rgba(255,255,255,.8) inset}
    3%{transform:scale(1.25);background:linear-gradient(135deg,var(--nx-primary-2),var(--nx-primary-dark));border-color:rgba(124,111,240,.9);box-shadow:0 0 0 clamp(4px,1.4cqi,8px) rgba(108,92,231,.15),0 clamp(4px,1.4cqi,10px) clamp(14px,4.5cqi,22px) rgba(108,92,231,.45)}
    7%{transform:scale(1);background:linear-gradient(135deg,var(--nx-primary-2),var(--nx-primary-dark));border-color:rgba(124,111,240,.9);box-shadow:0 0 0 clamp(2px,.8cqi,4px) rgba(108,92,231,.1),0 clamp(4px,1.4cqi,10px) clamp(14px,4.5cqi,22px) rgba(108,92,231,.3)}
    79%{background:linear-gradient(135deg,var(--nx-primary-2),var(--nx-primary-dark));border-color:rgba(124,111,240,.9)}
    85%{background:linear-gradient(135deg,var(--nx-primary-2),var(--nx-primary-dark));border-color:rgba(124,111,240,.9);box-shadow:0 0 0 clamp(2px,.8cqi,4px) rgba(108,92,231,.1),0 clamp(4px,1.4cqi,10px) clamp(14px,4.5cqi,22px) rgba(108,92,231,.3),0 0 clamp(10px,4cqi,24px) var(--nx-primary)}
    95%{background:#fff;border-color:rgba(108,92,231,.28);box-shadow:0 clamp(3px,1.2cqi,8px) clamp(10px,3.5cqi,18px) rgba(108,92,231,.15),0 1px 0 rgba(255,255,255,.8) inset}
    100%{background:#fff;border-color:rgba(108,92,231,.28)}
  }
  @keyframes nxcsb02numFade{
    0%,2%{opacity:1}
    4%,92%{opacity:0}
    95%,100%{opacity:1}
  }
  @keyframes nxcsb02checkIn{
    0%,2%{opacity:0;transform:scale(.4)}
    5%,88%{opacity:1;transform:scale(1)}
    92%,100%{opacity:0;transform:scale(.4)}
  }
  @keyframes nxcsb02labelGlow{
    0%,2%{color:rgba(108,92,231,.65);font-weight:400}
    5%,88%{color:var(--nx-primary-dark);font-weight:700}
    92%,100%{color:rgba(108,92,231,.65);font-weight:400}
  }

  /* ===== Celebration burst at the end ===== */
  .nxcsb02-viz .nxcsb02-burst{
    position:absolute;
    top:50%;left:50%;
    width:60%;aspect-ratio:1/1;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:2;
    opacity:0;
    animation:nxcsb02burst 7s ease-out infinite;
  }
  .nxcsb02-viz .nxcsb02-burst::before,
  .nxcsb02-viz .nxcsb02-burst::after{
    content:'';position:absolute;inset:0;
    border-radius:50%;
    border:2px solid var(--nx-primary);
  }
  .nxcsb02-viz .nxcsb02-burst::after{border-color:var(--nx-accent);animation-delay:.15s}
  @keyframes nxcsb02burst{
    0%,80%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
    83%{opacity:.8;transform:translate(-50%,-50%) scale(.5)}
    92%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}
  }

  /* ===== Bottom progress strip ===== */
  .nxcsb02-viz .nxcsb02-bar{
    position:absolute;
    left:clamp(14px,4.5cqi,24px);
    right:clamp(14px,4.5cqi,24px);
    bottom:clamp(14px,4.5cqi,24px);
    display:flex;align-items:center;
    gap:clamp(6px,2cqi,10px);
    z-index:4;
  }
  .nxcsb02-viz .nxcsb02-bar-lbl{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(7.5px,1.9cqi,9.5px);
    letter-spacing:.18em;
    color:rgba(108,92,231,.6);
    text-transform:uppercase;
    font-weight:600;
  }
  .nxcsb02-viz .nxcsb02-bar-track{
    flex:1;
    height:clamp(3px,.9cqi,5px);
    border-radius:99px;
    background:rgba(108,92,231,.12);
    overflow:hidden;
    position:relative;
  }
  .nxcsb02-viz .nxcsb02-bar-fill{
    position:absolute;inset:0;
    width:0;
    background:linear-gradient(90deg,var(--nx-primary),var(--nx-primary-3));
    border-radius:inherit;
    box-shadow:0 0 clamp(6px,2cqi,10px) rgba(108,92,231,.55);
    animation:nxcsb02barFill 7s cubic-bezier(.65,0,.35,1) infinite;
  }
  @keyframes nxcsb02barFill{
    0%,7%{width:0%}
    25%{width:20%}
    40%{width:40%}
    55%{width:60%}
    70%{width:80%}
    85%,92%{width:100%}
    100%{width:0%}
  }
  .nxcsb02-viz .nxcsb02-bar-tag{
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(7.5px,1.9cqi,9.5px);
    letter-spacing:.1em;
    color:var(--nx-primary);
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  /* ===== Responsive adjustments ===== */
  @container nxcsb02viz (max-width:340px){
