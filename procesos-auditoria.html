<style>
  /* ===================================================================
     WIDGET PROCESOS · AUDITORÍA — listo para Elementor HTML widget
     Todo el CSS está scopeado al contenedor .nxcsb02-viz.
     No modifica <body>, <html>, ni aplica resets globales.
     ================================================================= */

  /* @property registra la variable globalmente pero con nombre namespaced */
  @property --nxcsb02-roi{
    syntax:'<integer>';
    inherits:false;
    initial-value:0;
  }

  /* Reset acotado: solo afecta a los descendientes del widget */
  .nxcsb02-viz,
  .nxcsb02-viz *,
  .nxcsb02-viz *::before,
  .nxcsb02-viz *::after{
    box-sizing:border-box;
  }

  .nxcsb02-viz{
    --nx-bg-a:#FAFAFC;
    --nx-bg-b:#F3F1FA;
    --nx-primary:#6C5CE7;
    --nx-primary-2:#7C6FF0;
    --nx-primary-3:#9B8BFF;
    --nx-primary-dark:#4A3DC9;
    --nx-ink:#1A1433;

    position:relative;
    width:100%;
    max-width:480px;
    aspect-ratio:1/1;
    margin:0 auto;
    border-radius:clamp(14px,4cqi,22px);
    overflow:hidden;
    background:radial-gradient(ellipse at center,var(--nx-bg-a),var(--nx-bg-b));
    border:1px solid rgba(108,92,231,.14);
    box-shadow:
      0 clamp(10px,3cqi,24px) clamp(30px,9cqi,60px) -12px rgba(108,92,231,.35),
      0 2px 0 rgba(255,255,255,.6) inset;
    container-type:inline-size;
    container-name:nxcsb02viz;
    isolation:isolate;
    animation:nxcsb02enter .9s cubic-bezier(.2,.9,.2,1) both;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @keyframes nxcsb02enter{
    from{opacity:0;transform:translateY(12px) scale(.97)}
    to{opacity:1;transform:none}
  }

  .nxcsb02-viz .nxcsb02-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(108,92,231,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(108,92,231,.07) 1px,transparent 1px);
    background-size:12% 12%;
    -webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);
            mask-image:radial-gradient(ellipse at center,#000 55%,transparent 100%);
    opacity:.6;
  }
  .nxcsb02-viz .nxcsb02-glow{
    position:absolute;inset:0;
    background:radial-gradient(circle at 50% 45%,rgba(108,92,231,.18),transparent 60%);
    animation:nxcsb02breath 5.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes nxcsb02breath{
    0%,100%{opacity:.45;transform:scale(.96)}
    50%{opacity:1;transform:scale(1.04)}
  }

  .nxcsb02-viz .nxcsb02-corners{position:absolute;inset:clamp(10px,3cqi,18px);pointer-events:none;z-index:4}
  .nxcsb02-viz .nxcsb02-corners::before,
  .nxcsb02-viz .nxcsb02-corners::after,
  .nxcsb02-viz .nxcsb02-corners > i{
    content:'';position:absolute;
    width:clamp(10px,3cqi,18px);
    height:clamp(10px,3cqi,18px);
    border:1.5px solid rgba(108,92,231,.35);
    border-radius:3px;
  }
  .nxcsb02-viz .nxcsb02-corners::before{top:0;left:0;border-right:0;border-bottom:0}
  .nxcsb02-viz .nxcsb02-corners::after{top:0;right:0;border-left:0;border-bottom:0}
  .nxcsb02-viz .nxcsb02-corners .bl{bottom:0;left:0;border-right:0;border-top:0;display:block}
  .nxcsb02-viz .nxcsb02-corners .br{bottom:0;right:0;border-left:0;border-top:0;display:block}

  .nxcsb02-viz .nxcsb02-stage{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:18%}
  .nxcsb02-viz .nxcsb02-gears{position:relative;width:72%;aspect-ratio:1/1}
  .nxcsb02-viz .nxcsb02-gear{
    position:absolute;
    border-radius:50%;
    transform-origin:50% 50%;
    will-change:transform;
  }
  .nxcsb02-viz .nxcsb02-gear svg{
    width:100%;height:100%;display:block;
    filter:drop-shadow(0 1.5cqi 3cqi rgba(108,92,231,.28));
  }
  .nxcsb02-viz .nxcsb02-gear::before{
    content:'';
    position:absolute;inset:-8%;
    border-radius:50%;
    background:radial-gradient(circle,rgba(108,92,231,.2),transparent 65%);
    z-index:-1;
    animation:nxcsb02halo 3s ease-in-out infinite;
  }
  @keyframes nxcsb02halo{
    0%,100%{opacity:.35;transform:scale(.95)}
    50%{opacity:.8;transform:scale(1.05)}
  }

  .nxcsb02-viz .nxcsb02-g1{
    top:2%;left:2%;width:50%;
    animation:nxcsb02rotA 9s linear infinite,nxcsb02pop .9s cubic-bezier(.2,1.6,.3,1) .1s both;
  }
  .nxcsb02-viz .nxcsb02-g2{
    bottom:4%;right:4%;width:44%;
    animation:nxcsb02rotB 11s linear infinite,nxcsb02pop .9s cubic-bezier(.2,1.6,.3,1) .25s both;
  }
  .nxcsb02-viz .nxcsb02-g3{
    top:36%;right:10%;width:26%;
    animation:nxcsb02rotA 6s linear infinite,nxcsb02pop .9s cubic-bezier(.2,1.6,.3,1) .4s both;
  }
  @keyframes nxcsb02rotA{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes nxcsb02rotB{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
  @keyframes nxcsb02pop{
    from{opacity:0;transform:scale(.4) rotate(-30deg)}
    to{opacity:1;transform:scale(1) rotate(0)}
  }

  .nxcsb02-viz .nxcsb02-arrows{position:absolute;inset:0;pointer-events:none;z-index:2}
  .nxcsb02-viz .nxcsb02-arrows svg{width:100%;height:100%}
  .nxcsb02-viz .nxcsb02-flow{
    stroke-dasharray:6 5;
    animation:nxcsb02dash 1.6s linear infinite;
    filter:drop-shadow(0 0 2px rgba(108,92,231,.5));
  }
  @keyframes nxcsb02dash{to{stroke-dashoffset:-22}}

  .nxcsb02-viz .nxcsb02-spark{
    position:absolute;
    width:clamp(4px,1.3cqi,7px);
    aspect-ratio:1/1;
    border-radius:50%;
    background:#E85BE5;
    box-shadow:0 0 clamp(4px,1.8cqi,10px) #E85BE5;
    opacity:0;
    z-index:2;
    animation:nxcsb02spark 2.8s ease-in-out infinite;
  }
  .nxcsb02-viz .nxcsb02-spark.s1{top:18%;left:52%;animation-delay:0s}
  .nxcsb02-viz .nxcsb02-spark.s2{top:46%;left:28%;animation-delay:.9s}
  .nxcsb02-viz .nxcsb02-spark.s3{top:50%;left:70%;animation-delay:1.5s}
  .nxcsb02-viz .nxcsb02-spark.s4{top:58%;left:50%;animation-delay:2.1s}
  @keyframes nxcsb02spark{
    0%,100%{opacity:0;transform:scale(.4)}
    40%,55%{opacity:1;transform:scale(1)}
  }

  .nxcsb02-viz .nxcsb02-bar{
    position:absolute;
    left:clamp(10px,4.5cqi,22px);
    right:clamp(10px,4.5cqi,22px);
    bottom:clamp(12px,5cqi,24px);
    height:clamp(38px,13cqi,56px);
    background:#fff;
    border:1px solid rgba(108,92,231,.2);
    border-radius:clamp(8px,2.2cqi,12px);
    box-shadow:
      0 clamp(6px,2.4cqi,14px) clamp(18px,6cqi,32px) rgba(108,92,231,.15),
      0 1px 0 rgba(255,255,255,.8) inset;
    display:flex;align-items:center;
    padding:0 clamp(10px,3.2cqi,16px);
    gap:clamp(7px,2.2cqi,12px);
    z-index:3;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    animation:nxcsb02barRise .9s cubic-bezier(.2,.9,.2,1) .5s both;
  }
  @keyframes nxcsb02barRise{
    from{opacity:0;transform:translateY(20%)}
    to{opacity:1;transform:none}
  }

  .nxcsb02-viz .nxcsb02-bar-lbl{
    font-size:clamp(7.5px,2.1cqi,10px);
    letter-spacing:.14em;
    color:rgba(108,92,231,.75);
    text-transform:uppercase;
    font-weight:600;
  }
  .nxcsb02-viz .nxcsb02-bar-track{
    flex:1;
    height:clamp(4px,1.4cqi,7px);
    border-radius:4px;
    background:rgba(108,92,231,.1);
    overflow:hidden;
    position:relative;
  }
  .nxcsb02-viz .nxcsb02-bar-fill{
    position:absolute;inset:0;
    width:0;
    background:linear-gradient(90deg,var(--nx-primary),var(--nx-primary-3));
    border-radius:inherit;
    box-shadow:0 0 clamp(6px,2cqi,12px) rgba(108,92,231,.6);
    animation:nxcsb02fill 5s cubic-bezier(.65,0,.35,1) infinite .7s;
  }
  .nxcsb02-viz .nxcsb02-bar-fill::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
    animation:nxcsb02shine 1.8s ease-in-out infinite;
  }
  @keyframes nxcsb02fill{
    0%{width:0%;opacity:1}
    50%,75%{width:92%;opacity:1}
    88%{width:92%;opacity:.35}
    100%{width:0%;opacity:1}
  }
  @keyframes nxcsb02shine{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(100%)}
  }

  .nxcsb02-viz .nxcsb02-bar-val{
    font-size:clamp(9px,2.4cqi,11px);
    color:var(--nx-ink);
    font-weight:700;
    letter-spacing:.02em;
    min-width:clamp(34px,10cqi,48px);
    text-align:right;
    font-variant-numeric:tabular-nums;
    --nxcsb02-roi:0;
    counter-reset:nxroi var(--nxcsb02-roi);
    animation:nxcsb02count 5s cubic-bezier(.65,0,.35,1) infinite .7s;
  }
  .nxcsb02-viz .nxcsb02-bar-val::after{content:'+'counter(nxroi)'%'}
  @keyframes nxcsb02count{
    0%{--nxcsb02-roi:0}
    50%,75%{--nxcsb02-roi:23}
    88%{--nxcsb02-roi:23}
    100%{--nxcsb02-roi:0}
  }

  .nxcsb02-viz .nxcsb02-hud,
  .nxcsb02-viz .nxcsb02-hud-r{
    position:absolute;
    z-index:5;
    font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    font-size:clamp(8px,2.2cqi,10.5px);
    letter-spacing:.14em;
    text-transform:uppercase;
    line-height:1;
    white-space:nowrap;
    margin:0;
  }
  .nxcsb02-viz .nxcsb02-hud{
    left:clamp(14px,4.5cqi,24px);
    top:clamp(14px,4.5cqi,24px);
    color:rgba(108,92,231,.8);
    display:flex;gap:clamp(6px,1.8cqi,10px);align-items:center;
  }
  .nxcsb02-viz .nxcsb02-hud span{
    width:clamp(5px,1.4cqi,7px);
    aspect-ratio:1/1;
    border-radius:50%;
    background:var(--nx-primary);
    box-shadow:0 0 clamp(4px,1.6cqi,9px) var(--nx-primary);
    animation:nxcsb02pulse 1.6s ease-in-out infinite;
    flex-shrink:0;
  }
  @keyframes nxcsb02pulse{
    0%,100%{opacity:.4;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.1)}
  }
  .nxcsb02-viz .nxcsb02-hud-r{
    right:clamp(14px,4.5cqi,24px);
    top:clamp(14px,4.5cqi,24px);
    color:var(--nx-primary);
    display:flex;align-items:center;gap:clamp(4px,1.2cqi,6px);
    font-weight:700;
  }
  .nxcsb02-viz .nxcsb02-hud-r::before{
    content:'▲';
    font-size:.8em;
    color:var(--nx-primary);
    animation:nxcsb02trendUp 1.8s ease-in-out infinite;
  }
  @keyframes nxcsb02trendUp{
    0%,100%{transform:translateY(0);opacity:.7}
    50%{transform:translateY(-20%);opacity:1}
  }

  @container nxcsb02viz (max-width:340px){
    .nxcsb02-viz .nxcsb02-bar{padding:0 10px;gap:8px}
    .nxcsb02-viz .nxcsb02-hud-r{letter-spacing:.08em}
  }
  @container nxcsb02viz (max-width:260px){
    .nxcsb02-viz .nxcsb02-hud{letter-spacing:.06em}
    .nxcsb02-viz .nxcsb02-corners{inset:clamp(6px,2.5cqi,12px)}
  }

  @media (prefers-reduced-motion: reduce){
    .nxcsb02-viz,
    .nxcsb02-viz .nxcsb02-glow,
    .nxcsb02-viz .nxcsb02-gear,
    .nxcsb02-viz .nxcsb02-gear::before,
    .nxcsb02-viz .nxcsb02-flow,
    .nxcsb02-viz .nxcsb02-spark,
    .nxcsb02-viz .nxcsb02-bar,
    .nxcsb02-viz .nxcsb02-bar-fill,
    .nxcsb02-viz .nxcsb02-bar-fill::after,
    .nxcsb02-viz .nxcsb02-bar-val,
    .nxcsb02-viz .nxcsb02-hud span,
    .nxcsb02-viz .nxcsb02-hud-r::before{
      animation:none !important;
    }
    .nxcsb02-viz .nxcsb02-bar-fill{width:92%}
  }
</style>

<div class="nxcsb02-viz" role="img" aria-label="Auditoría de procesos: +23% ROI">
  <div class="nxcsb02-grid"></div>
  <div class="nxcsb02-glow"></div>
  <div class="nxcsb02-corners" aria-hidden="true"><i class="bl"></i><i class="br"></i></div>

  <div class="nxcsb02-hud"><span></span>Procesos · Auditoría</div>
  <div class="nxcsb02-hud-r">+23% ROI</div>

  <div class="nxcsb02-stage">
    <div class="nxcsb02-gears">
      <div class="nxcsb02-gear nxcsb02-g1">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="nxcsb02grA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6C5CE7"/>
              <stop offset="1" stop-color="#4A3DC9"/>
            </linearGradient>
          </defs>
          <path fill="url(#nxcsb02grA)" d="M50 6l5 9 10-2 2 10 10 5-3 9 7 8-7 8 3 9-10 5-2 10-10-2-5 9-5-9-10 2-2-10-10-5 3-9-7-8 7-8-3-9 10-5 2-10 10 2z"/>
          <circle cx="50" cy="50" r="16" fill="#fff"/>
          <circle cx="50" cy="50" r="5" fill="#6C5CE7"/>
        </svg>
      </div>
      <div class="nxcsb02-gear nxcsb02-g2">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="nxcsb02grB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#7C6FF0"/>
              <stop offset="1" stop-color="#5A4BD6"/>
            </linearGradient>
          </defs>
          <path fill="url(#nxcsb02grB)" d="M50 8l4 8 9-1 1 9 9 4-2 9 6 7-6 7 2 9-9 4-1 9-9-1-4 8-4-8-9 1-1-9-9-4 2-9-6-7 6-7-2-9 9-4 1-9 9 1z"/>
          <circle cx="50" cy="50" r="14" fill="#fff"/>
          <circle cx="50" cy="50" r="4" fill="#7C6FF0"/>
        </svg>
      </div>
      <div class="nxcsb02-gear nxcsb02-g3">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path fill="#9B8BFF" d="M50 10l4 8 9-1 1 9 8 4-2 8 6 7-6 7 2 8-8 4-1 9-9-1-4 8-4-8-9 1-1-9-8-4 2-8-6-7 6-7-2-8 8-4 1-9 9 1z"/>
          <circle cx="50" cy="50" r="12" fill="#fff"/>
          <circle cx="50" cy="50" r="3.5" fill="#9B8BFF"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="nxcsb02-arrows" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="nxcsb02-flow" d="M20 44 Q32 30 44 40" fill="none" stroke="#6C5CE7" stroke-width="1.2"/>
      <path class="nxcsb02-flow" d="M60 38 Q72 50 78 64" fill="none" stroke="#7C6FF0" stroke-width="1.2" style="animation-delay:.5s"/>
      <path class="nxcsb02-flow" d="M54 60 Q40 66 28 58" fill="none" stroke="#9B8BFF" stroke-width="1.2" style="animation-delay:1s"/>
    </svg>
  </div>

  <div class="nxcsb02-spark s1" aria-hidden="true"></div>
  <div class="nxcsb02-spark s2" aria-hidden="true"></div>
  <div class="nxcsb02-spark s3" aria-hidden="true"></div>
  <div class="nxcsb02-spark s4" aria-hidden="true"></div>

  <div class="nxcsb02-bar">
    <span class="nxcsb02-bar-lbl">ROI</span>
    <div class="nxcsb02-bar-track"><div class="nxcsb02-bar-fill"></div></div>
    <span class="nxcsb02-bar-val" aria-live="polite"></span>
  </div>
</div>
